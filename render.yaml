services:
  - type: web
    name: valueinvest-52lows
    runtime: python
    region: oregon
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server.main:app --host 0.0.0.0 --port $PORT
    disk:
      name: scanner-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DB_PATH
        value: /var/data/scanner.db
      - key: CORS_ORIGINS
        value: https://scanner.sasfaw.com,https://sasfaw.com,https://www.sasfaw.com
      - key: PYTHON_VERSION
        value: "3.11"
